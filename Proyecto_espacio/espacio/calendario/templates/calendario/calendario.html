{% extends "management/layout_management.html" %}

{% block content %}
<div class="container-fluid" id="calendario">
  <div id='calendar'></div>
</div>

{% endblock %}

{% block scripts %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.min.css" rel="stylesheet">
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var calendarEl = document.getElementById('calendar');

    if (!calendarEl) {
      console.error('No se encontró el contenedor #calendar');
      return;
    }

    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      locale: 'es',
      events: '/management/calendario/disponibilidad/',
      eventColor: '#28a745',
      eventClick: function(info) {
        const fecha = info.event.startStr;
        // Redirige a la vista detallada del día
        window.location.href = `/management/calendario/detalle/?fecha=${fecha}`;
      }
    });

    calendar.render();
  });
</script>
{% endblock %}
