{% extends "management/layout_management.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>Inscribir cliente al evento: <strong>{{ evento.titulo }}</strong></h2>

    <form method="POST" class="mt-3 modo-cliente-form">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small">
                {{ field.errors|striptags }}
            </div>
            {% endif %}
        </div>
        {% endfor %}

        <!-- Esta es la sección de pago, que se mostrará solo si el modo es 'cliente' -->
        <div id="seccion_pago" class="d-none">
            <div class="mb-3">
                <label for="id_monto_pagado" class="form-label">Monto Pagado</label>
                <input type="number" name="monto_pagado" id="id_monto_pagado" class="form-control">
            </div>
            <div class="mb-3">
                <label for="id_metodo_pago" class="form-label">Método de Pago</label>
                <select name="metodo_pago" id="id_metodo_pago" class="form-control">
                    <option value="">Seleccionar</option>
                    <option value="efectivo">Efectivo</option>
                    <option value="transferencia">Transferencia</option>
                    <option value="mercadopago">MercadoPago</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-success">Inscribir</button>
        <a href="{% url 'eventos_admin:detalle_eventos' evento.pk %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<!-- Script que muestra u oculta la sección de pago -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector('.modo-cliente-form');
    const inputModo = form?.querySelector('#id_modo');
    const seccionPago = form?.querySelector('#seccion_pago');

    function actualizarPago() {
        if (inputModo && inputModo.value === 'cliente') {
            seccionPago?.classList.remove('d-none');
        } else {
            seccionPago?.classList.add('d-none');
        }
    }

    inputModo?.addEventListener('change', actualizarPago);
    actualizarPago();
});
</script>
{% endblock %}
