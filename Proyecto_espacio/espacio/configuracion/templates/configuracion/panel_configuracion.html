{% extends 'management/layout_management.html' %}
{% load static %}

{% block content %}
<h2 class="mb-4">Configuración del Estudio</h2>

<div class="grid gap-4 max-w-xl">
  {% for campo, valor in configuracion.items %}
    <div class="flex items-center justify-between border p-3 rounded shadow">
      <div class="flex items-center gap-2">
        <i class=""></i>
        <strong>{{ campo|capfirst }}:</strong>
        <span id="valor-{{ campo }}">{{ valor|default:"—" }}</span>
      </div>
      <button onclick="editarCampo('{{ campo }}')" class="text-blue-600 hover:underline">Editar</button>
    </div>

    <!-- Formulario oculto por campo -->
    <form id="form-{{ campo }}" method="post" action="{% url 'actualizar_campo' campo %}" class="hidden mt-1 flex gap-2">
      {% csrf_token %}
      <input type="text" name="valor" value="{{ valor }}" class="border p-1 rounded w-full">
      <button type="submit" class="bg-green-500 text-white px-2 py-1 rounded">Guardar</button>
      <button type="button" onclick="cancelarEdicion('{{ campo }}')" class="text-red-500">Cancelar</button>
    </form>
  {% endfor %}
</div>

<script>
  function editarCampo(campo) {
    document.getElementById('form-' + campo).classList.remove('hidden');
    document.getElementById('valor-' + campo).style.display = 'none';
  }

  function cancelarEdicion(campo) {
    document.getElementById('form-' + campo).classList.add('hidden');
    document.getElementById('valor-' + campo).style.display = 'inline';
  }
</script>
{% endblock %}
