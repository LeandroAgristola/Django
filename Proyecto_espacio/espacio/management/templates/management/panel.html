{% extends "management/layout_management.html" %}
{% load static %}

{% block content %}
<div class="container-fluid" id="#">
  <h2 class="mb-4"><strong>Estadisticas</strong></h2>

  <!-- Clientes: Altas vs Bajas -->
  <div class="row g-4">
    <!-- Clientes -->
    <div class="col-md-6">
      <div class="bg-white p-4 rounded shadow-sm">
        <h5 class="mb-3">Movimiento Anual de Clientes</h5>
        <canvas id="chartClientes"></canvas>
        <p class="mt-3 text-muted text-center">Año calendario completo</p>
      </div>
    </div>

    <!-- Turnos por Día -->
    <div class="col-md-6">
      <div class="bg-white p-4 rounded shadow-sm">
          <h5 class="mb-3">Disponibilidad Diaria de Turnos</h5>
          <div class="mb-3">
              <button class="btn btn-outline-primary btn-sm me-2 btn-calendario-range active" data-range="actual">Este mes</button>
              <button class="btn btn-outline-primary btn-sm btn-calendario-range" data-range="siguiente">Próximo mes</button>
          </div>
          <canvas id="chartCalendario" ></canvas>
      </div>
    </div>

    <!-- Gente por Plan -->
    <div class="col-md-6">
      <div class="bg-white p-4 rounded shadow-sm">
        <h5 class="mb-3">Cantidad de Gente por Plan</h5>
        <canvas id="chartPlanes"></canvas>
      </div>
    </div>

    <!-- Participación en Eventos -->
    <div class="col-md-6">
      <div class="bg-white p-4 rounded shadow-sm">
        <h5 class="mb-3">Eventos: Participación</h5>
        <div class="mb-3">
          <button class="btn btn-outline-primary btn-sm me-2 btn-range active" data-range="1m">Último mes</button>
          <button class="btn btn-outline-primary btn-sm me-2 btn-range" data-range="3m">Últimos 3 meses</button>
          <button class="btn btn-outline-primary btn-sm btn-range" data-range="1y">Último año</button>
        </div>
        <canvas id="chartEventos"></canvas>
      </div>
    </div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{% static 'management/js/panel_estadisticas.js' %}"></script>
{% endblock %}
